name: ai-refund-system

x-backend-build: &backend-build
  context: .
  dockerfile: docker/backend/Dockerfile

x-backend-env-files: &backend-env-files
  - path: ./docker/backend/.env.example
    required: true
  - path: ./docker/backend/.env
    required: false

x-frontend-env-files: &frontend-env-files
  - path: ./docker/frontend/.env.example
    required: true
  - path: ./docker/frontend/.env
    required: false

x-backend-service: &backend-service
  image: ai-refund-system-backend:local
  build: *backend-build
  restart: unless-stopped
  env_file: *backend-env-files
  volumes:
    - backend_storage:/var/www/html/storage

services:
  migrate:
    <<: *backend-service
    restart: "no"
    command:
      - php
      - artisan
      - migrate
      - --force
      - --no-interaction
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/up" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  frontend:
    image: ai-refund-system-frontend:local
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    env_file: *frontend-env-files
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: *backend-env-files
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12

  horizon:
    <<: *backend-service
    command: [ "php", "artisan", "horizon" ]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "php artisan horizon:status | grep -qi running" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  reverb:
    <<: *backend-service
    command: [ "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--no-interaction" ]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${REVERB_FORWARD_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 8080" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  scheduler:
    <<: *backend-service
    command: [ "php", "artisan", "schedule:work", "--no-interaction" ]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "ps | grep -q '[a]rtisan schedule:work'" ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  backend_storage:
  postgres_data:
  redis_data:
