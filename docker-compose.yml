name: ai-refund-system

x-backend-build: &backend-build
  context: .
  dockerfile: docker/backend/Dockerfile

x-backend-env-files: &backend-env-files
  - path: ./docker/backend/.env.example
    required: true
  - path: ./docker/backend/.env
    required: false

x-backend-test-env-files: &backend-test-env-files
  - path: ./docker/backend/.env.example
    required: true
  - path: ./docker/backend/.env
    required: false
  - path: ./docker/backend/.env.testing.example
    required: true
  - path: ./docker/backend/.env.testing
    required: false

x-frontend-env-files: &frontend-env-files
  - path: ./docker/frontend/.env.example
    required: true
  - path: ./docker/frontend/.env
    required: false

x-backend-watch: &backend-watch
  watch:
    - action: sync+restart
      path: ./backend
      target: /var/www/html
      ignore:
        - .ai/
        - .agents/
        - .codex/
        - .env
        - .env.*
        - AGENTS.md
        - bootstrap/cache/
        - composer.json
        - composer.lock
        - node_modules/
        - storage/
        - tests/
        - vendor/
    - action: rebuild
      path: ./backend/composer.json
    - action: rebuild
      path: ./backend/composer.lock

x-frontend-watch: &frontend-watch
  watch:
    - action: sync
      path: ./frontend
      target: /app
      ignore:
        - .env
        - .env.*
        - .nuxt/
        - .output/
        - .cache/
        - coverage/
        - node_modules/
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - test-results/
        - tests/
    - action: rebuild
      path: ./frontend/package.json
    - action: rebuild
      path: ./frontend/pnpm-lock.yaml
    - action: rebuild
      path: ./frontend/pnpm-workspace.yaml

x-backend-service: &backend-service
  image: ai-refund-system-backend:local
  build:
    <<: *backend-build
    target: development
  restart: unless-stopped
  env_file: *backend-env-files
  volumes:
    - backend_storage:/var/www/html/storage

services:
  migrate:
    <<: *backend-service
    restart: "no"
    command:
      - php
      - artisan
      - migrate
      - --seed
      - --force
      - --no-interaction
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend-service
    develop: *backend-watch
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/up" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  frontend:
    image: ai-refund-system-frontend:local
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: development
    restart: unless-stopped
    env_file: *frontend-env-files
    develop: *frontend-watch
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: *backend-env-files
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  test-database:
    image: postgres:17-alpine
    profiles: [ "test" ]
    restart: "no"
    env_file: *backend-test-env-files
    entrypoint: [ "/usr/local/bin/create-test-database" ]
    volumes:
      - ./docker/postgres/create-test-database.sh:/usr/local/bin/create-test-database:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend-test:
    image: ai-refund-system-backend-test:local
    profiles: [ "test" ]
    build:
      <<: *backend-build
      target: test
    restart: "no"
    env_file: *backend-test-env-files
    depends_on:
      test-database:
        condition: service_completed_successfully

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12

  horizon:
    <<: *backend-service
    develop: *backend-watch
    command: [ "php", "artisan", "horizon" ]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "php artisan horizon:status | grep -qi running" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  reverb:
    <<: *backend-service
    develop: *backend-watch
    command: [ "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--no-interaction" ]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${REVERB_FORWARD_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 8080" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  scheduler:
    <<: *backend-service
    develop: *backend-watch
    command: [ "php", "artisan", "schedule:work", "--no-interaction" ]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "ps | grep -q '[a]rtisan schedule:work'" ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  backend_storage:
  postgres_data:
  redis_data:
